name: Build Armbian for Orange Pi Zero 2W

on:
  workflow_dispatch: # This adds the "Run workflow" manual button in GitHub

jobs:
  build-armbian:
    # UPGRADED: ubuntu-24.04 -> ubuntu-26.04
    runs-on: ubuntu-26.04

    steps:
      # UPGRADED: v4 -> v7
      - name: Checkout Repository
        uses: actions/checkout@v7

      # UPGRADED: v3 -> v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # UPGRADED: v3 -> v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Run Armbian Build
        run: |
          ./compile.sh \
            BOARD=orangepizero2w \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no

      # UPGRADED: v4 -> v7
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: armbian_image
          path: output/images/*
          archive: false
