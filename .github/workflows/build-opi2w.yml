name: Build Armbian for Orange Pi Zero 2W

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'OS Release (e.g., forky, trixie, bookworm)'
        required: true
        default: 'forky'
        type: string

jobs:
  build-armbian:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Host QEMU & Binfmt Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Run Armbian Build
        run: |
          ./compile.sh \
            BOARD=orangepizero2w \
            BRANCH=current \
            RELEASE=${{ inputs.release }} \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: armbian_image
          path: output/images/*
          archive: false
