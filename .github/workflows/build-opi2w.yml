name: Build Armbian for Orange Pi Zero 2W

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'OS Release (e.g., resolute, noble, trixie, bookworm)'
        required: true
        default: 'bookworm'
        type: string

jobs:
  build-armbian:
    # UPGRADED: ubuntu-24.04 -> ubuntu-26.04
    runs-on: ubuntu-26.04

    steps:
      # UPGRADED: v4 -> v7
      - name: Checkout Repository
        uses: actions/checkout@v7

      # UPGRADED: v3 -> v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # UPGRADED: v3 -> v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Run Armbian Build
        run: |
          ./compile.sh \
            BOARD=orangepizero2w \
            BRANCH=current \
            RELEASE=${{ inputs.release }} \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no

      # UPGRADED: v4 -> v7
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: armbian_image
          path: output/images/*
          archive: false
