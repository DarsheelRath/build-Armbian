name: Build Armbian for Orange Pi Zero 2W

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'OS Release (e.g., resolute, noble, trixie, bookworm)'
        required: true
        default: 'oracular'
        type: string

jobs:
  build-armbian:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Run Armbian Build
        run: |
          ./compile.sh \
            BOARD=orangepizero2w \
            BRANCH=edge \
            RELEASE=${{ inputs.release }} \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no

      - name: Upload Armbian Image Artifact
        uses: actions/upload-artifact@v7
        with:
          name: armbian_image_unzipped
          path: output/images/*.img
          archive: false
